# railpack.toml

[install]
# The go.mod file is in the 'backend' directory, so we need to run
# 'go mod download' from there.
command = "cd backend && go mod download"

[build]
# The main package is in the 'backend/cmd' directory.
# This command changes into the 'backend' directory, builds the main package,
# and places the output binary named 'out' in the project root directory.
command = "cd backend && go build -ldflags='-w -s' -o ../out ./cmd"

# The default start command is './out', which will now work correctly
# because the build command places the binary in the root.
